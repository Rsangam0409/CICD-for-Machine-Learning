
name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install Packages
        run: make install

      - name: Verify Dependencies
        run: |
          python --version
          python -m pip show pandas
          python -c "import pandas, sklearn, matplotlib, skops; print('All dependencies imported successfully')"

      - name: Format
        run: make format

      - name: Train
        run: make train

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: Results/

      - name: Evaluation
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make eval
